/* kb-ovpn-creds: کادر «اطلاعات اتصال OpenVPN» داخل پنجرهٔ ساخت/ویرایش کاربر.
 *
 * رفتار (طبق چیزی که کاربر خواست):
 *   • حالت «ویرایش»: کادر از ابتدا همان یوزر/پسی را نشان می‌دهد که همین حالا روی
 *     سرور فعال است (از profiles خوانده می‌شود) — پیش‌فرض، نه رندوم تازه.
 *   • حالت «ساخت کاربر»: چون هنوز اکانتی نیست، یک جفت رندومِ یکتا از قبل پر است.
 *   • ⟳ رندوم: هر دو را عوض می‌کند. ⧉ کپی: هر دو را کپی می‌کند.
 *   • 💾 ذخیره: فقط «ثبت موقت» است؛ هیچ درخواستی به سرور نمی‌فرستد.
 *   • اعمال واقعی فقط با دکمهٔ آبی «ویرایش» (PUT کاربر) یا «ایجاد» (ساخت کاربر)
 *     انجام می‌شود؛ آن‌وقت مقادیرِ ثبت‌شده روی اکانت نوشته می‌شوند.
 *
 * هیچ متن توضیحی روی کادر نوشته نشده (فقط عنوان + دو فیلد + سه دکمه).
 * کل کد در try/catch است: در بدترین حالت فقط این کادر دیده نمی‌شود.
 */
(function () {
  "use strict";
  if (window.__kbOvpnCreds) return;
  window.__kbOvpnCreds = 1;

  var BASE = "/TeamGuccI";
  var CRED_API = BASE + "/panel/api/openvpn/credentials";
  var PROFILES_API = BASE + "/panel/api/openvpn/profiles";
  var SUFFIX = "+b:0+f1+f2+nr+pmp";
  var UPPER = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var LOWER = "abcdefghijkmnopqrstuvwxyz";
  var DIGIT = "23456789";
  var ALL = UPPER + LOWER + DIGIT;

  var SAVE_LABEL = "💾 ذخیره";
  var STAGED_LABEL = "✓ ذخیره";

  var state = {
    email: "", profiles: null, profilesAt: 0, saving: false, auth: "",
    fields: { username: "", password: "" },
    pending: null,          // credentials staged with 💾 (not on the server yet)
    mode: "",               // "edit" | "create"
    dialogOpen: false, closedAt: 0, openAt: 0,
    commitTimer: null, committing: false, resolving: false, groupOn: true

    return out + SUFFIX;
  }
  function randPass() {
    var chars = [UPPER.charAt(ra(UPPER.length)), LOWER.charAt(ra(LOWER.length)), DIGIT.charAt(ra(DIGIT.length))];
    while (chars.length < 32) chars.push(ALL.charAt(ra(ALL.length)));
    for (var i = chars.length - 1; i > 0; i -= 1) {
      var j = ra(i + 1), t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }
    return chars.join("");
  }

  function toast(msg, ok) {
    try {
      var d = document.createElement("div");
      d.textContent = msg;
      d.style.cssText = "position:fixed;z-index:2147483647;left:50%;transform:translateX(-50%);bottom:22px;"
        + "padding:10px 16px;border-radius:10px;font:13px/1.5 system-ui,sans-serif;max-width:92vw;text-align:center;"
        + "box-shadow:0 8px 30px rgba(0,0,0,.45);color:#fff;background:" + (ok === false ? "#b3261e" : "#1f7a4d") + ";";
      document.body.appendChild(d);
      setTimeout(function () { try { d.remove(); } catch (e) {} }, 3800);

  // so a dialog also counts as the user form when it carries the groups list and
  // a form — that check does not depend on any translation.
  var CREATE_HINTS = ["create user", "add user", "new user", "ساخت کاربر", "کاربر جدید", "ایجاد کاربر", "افزودن کاربر"];
  var EDIT_HINTS = ["edit user", "modify user", "update user", "ویرایش کاربر", "ویرایش"];

  function hintsMatch(text, hints) {
    for (var i = 0; i < hints.length; i += 1) {
      if (text.indexOf(hints[i]) >= 0) return true;
    }
    return false;
  }

  function looksLikeUserForm(dialog) {
    try {
      if (dialog.querySelectorAll('[role="checkbox"]').length < 2) return false;
      var inputs = dialog.querySelectorAll("input,textarea,select");
      return inputs.length > 0;
    } catch (e) { return false; }
  }

  function findDialog() {

    for (var i = all.length - 1; i >= 0; i -= 1) {

      var t = (d.textContent || "").toLowerCase();

  }

    return "";
  }

  // entry as <label><button role="checkbox" aria-checked="true|false">…</button></label>,

  function openVpnGroupSelected(dialog) {

    for (var i = 0; i < labels.length; i += 1) {
      var label = labels[i];

      var leaves = label.querySelectorAll("*");
      var named = false;
      for (var j = 0; j < leaves.length; j += 1) {
        if (leaves[j].children.length) continue;
        if ((leaves[j].textContent || "").trim().toLowerCase() !== "openvpn") continue;

  }

    var wrap = el("div", "display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 auto;min-width:0;");
    var btn = el("button", "width:100%;box-sizing:border-box;height:36px;padding:0 10px;border-radius:9px;cursor:pointer;"
      + "display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;white-space:nowrap;"
      + (accent
        ? "border:1px solid rgba(87,211,140,.55);background:rgba(87,211,140,.16);font-weight:600;color:inherit;"

  function setSaveLabel(box, text) {
    try {

  function build() {

      + "border:1px solid rgba(125,125,125,.4);background:rgba(125,125,125,.05);");
    box.setAttribute("data-kb-ovpn-box", "1");

    box.appendChild(el("div", "display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;",

      p.input.value = randPass();

    for (var j = all.length - 1; j >= 0; j -= 1) {
      var b = all[j];
      if (b.closest("[data-kb-ovpn-box]")) continue;
      if (/bg-primary/.test(String(b.className || ""))) return b;
    }
    return null;
  }

  // A staged pair has to be confirmable: the panel keeps its submit disabled
  // while no field changed, so it is re-enabled for that click only.
  function enableSubmit() {
    if (!state.pending) return;
    try {
      var d = findDialog();
      if (!d) return;
      var btn = primarySubmit(d);
      if (!btn) return;
      if (btn.disabled || btn.hasAttribute("disabled")) {
        btn.disabled = false;
        btn.removeAttribute("disabled");
        btn.setAttribute("data-kb-staged-submit", "1");
      }
    } catch (e) {}
  }

  function scheduleCommit(delay) {
    if (!state.pending || state.commitTimer) return;
    state.commitTimer = setTimeout(function () {
      state.commitTimer = null;
      commitPending(state.email || currentUsernameGuess());
    }, typeof delay === "number" ? delay : 1200);
  }

  function unstage(box) {
    state.pending = null;
    if (state.commitTimer) { clearTimeout(state.commitTimer); state.commitTimer = null; }
    if (!box) box = document.querySelector("[data-kb-ovpn-box]");
    if (box) setSaveLabel(box, SAVE_LABEL);
  }

  // 💾 only records the pair. Nothing reaches the server until the blue
  // "ویرایش" / "ایجاد" button submits the form.
  function stage() {
    var box = document.querySelector("[data-kb-ovpn-box]");
    if (!box) return;
    var username = (box.__kb.username.value || "").trim();
    var password = (box.__kb.password.value || "").trim();
    if (!username || !password) {
      toast("یوزرنیم و پسورد را پر کن", false);
      return;
    }
    state.pending = { username: username, password: password, email: state.email || currentUsernameGuess(), at: Date.now() };
    state.fields.username = username;
    state.fields.password = password;
    setSaveLabel(box, STAGED_LABEL);
    enableSubmit();
    flash(box.__kb.username); flash(box.__kb.password);
    toast("ثبت شد");
  }

  function fill(box, username, password) {
    try {
      box.__kb.username.value = username || "";
      box.__kb.password.value = password || "";
    } catch (e) {}
  }

  function setStatus(box, text) {
    try {
      box.__kb.status.textContent = text || "";
      box.__kb.status.style.display = text ? "block" : "none";
    } catch (e) {}
  }

  function deepUsername(obj, depth) {
    if (!obj || depth > 4) return "";
    if (typeof obj === "string") return "";
    var keys = ["username", "email"];
    for (var i = 0; i < keys.length; i += 1) {
      var v = obj[keys[i]];
      if (typeof v === "string" && v.trim()) return v.trim();
    }
    for (var k in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
      var child = obj[k];
      if (child && typeof child === "object") {
        var found = deepUsername(child, depth + 1);
        if (found) return found;
      }
    }
    return "";
  }

  function authHeaders(extra) {
    var h = extra || {};
    h["X-Requested-With"] = "XMLHttpRequest";
    if (state.auth) h["Authorization"] = state.auth;
    return h;
  }

  function captureAuth(input, init) {
    try {
      var h = (init && init.headers) || (input && input.headers);
      var value = null;
      if (h) {
        if (typeof h.get === "function") value = h.get("authorization");
        else if (Array.isArray(h)) {
          for (var i = 0; i < h.length; i += 1) {
            if (String(h[i][0]).toLowerCase() === "authorization") value = h[i][1];
          }
        } else {
          for (var k in h) {
            if (Object.prototype.hasOwnProperty.call(h, k) && k.toLowerCase() === "authorization") value = h[k];
          }
        }
      }
      if (value && /^Bearer\s+/i.test(String(value))) { state.auth = String(value); return; }
      if (state.auth) return;
      var keys = ["token", "access_token", "accessToken", "auth"];
      for (var j = 0; j < keys.length; j += 1) {
        var raw = null;
        try { raw = localStorage.getItem(keys[j]) || sessionStorage.getItem(keys[j]); } catch (e) {}
        if (!raw) continue;
        var text = String(raw).replace(/^"|"$/g, "");
        try { var parsed = JSON.parse(text); if (parsed && parsed.access_token) text = parsed.access_token; } catch (e) {}
        if (/^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\./.test(text)) { state.auth = "Bearer " + text; return; }
      }
    } catch (e) {}
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: "POST",
      credentials: "same-origin",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  // A user created seconds ago is not mirrored into the OpenVPN layer's
  // database yet, so the first POST can answer "Account not found".
  var RETRY_MS = [800, 1500, 2500, 4000, 6000, 8000, 10000];

  function applyCreds(email, username, password, manual, attempt) {
    var tries = typeof attempt === "number" ? attempt : 0;
    var box = document.querySelector("[data-kb-ovpn-box]");
    if (!username || !password) {
      if (manual) toast("یوزرنیم و پسورد را پر کن", false);
      return Promise.resolve(false);
    }
    if (!email) {
      if (manual) toast("کاربر مشخص نشد", false);
      return Promise.resolve(false);
    }
    state.saving = true;
    if (box) setStatus(box, "");
    return postJSON(CRED_API, { email: email, username: username, password: password })
      .then(function (res) {
        if (res && res.success) {
          state.saving = false;
          state.pending = null;
          state.fields.username = username;
          state.fields.password = password;
          state.profiles = null; state.profilesAt = 0;
          if (box) {
            fill(box, username, password);
            setSaveLabel(box, SAVE_LABEL);
          }
          setTimeout(function () { verifyApplied(email, username, password, 0); }, 2200);
          return true;
        }
        var msg = String((res && (res.msg || res.detail)) || "");
        if ((/not found/i.test(msg) || /unauthorized/i.test(msg)) && tries < RETRY_MS.length) {
          setTimeout(function () { applyCreds(email, username, password, manual, tries + 1); }, RETRY_MS[tries]);
          return false;
        }
        state.saving = false;
        toast("اعمال نشد: " + (msg || "خطای نامشخص"), false);
        return false;
      })
      .catch(function (err) {
        if (tries < 3) {
          setTimeout(function () { applyCreds(email, username, password, manual, tries + 1); }, RETRY_MS[tries] || 2000);
          return false;
        }
        state.saving = false;
        if (manual) toast("اعمال نشد: " + ((err && err.message) || err), false);
        return false;
      });
  }

  // The dashboard and the VPN layer can write the client map at the same time;
  // a stale write would silently restore the previous pair. Re-read once and
  // re-apply when the server does not show what we just saved.
  function verifyApplied(email, username, password, attempt) {
    var tries = typeof attempt === "number" ? attempt : 0;
    if (tries > 2) return Promise.resolve(false);
    return loadProfiles(true).then(function (accs) {
      var hit = null;
      for (var i = 0; i < accs.length; i += 1) {
        if ((accs[i].email || "").toLowerCase() === String(email || "").toLowerCase()) { hit = accs[i]; break; }
      }
      if (!hit) return false;
      if (hit.username === username && hit.password === password) return true;
      return applyCreds(email, username, password, false, 0).then(function (ok) {
        if (!ok) return false;
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(verifyApplied(email, username, password, tries + 1)); }, 1500);
        });
      });
    }).catch(function () { return false; });
  }

  function commitPending(email) {
    if (state.groupOn === false) return Promise.resolve(false);
    var pend = state.pending;
    if (!pend || state.committing) return Promise.resolve(false);
    state.committing = true;
    if (state.commitTimer) { clearTimeout(state.commitTimer); state.commitTimer = null; }
    var target = email || pend.email || state.email || currentUsernameGuess();
    if (!target) return Promise.resolve(false);
    return applyCreds(target, pend.username, pend.password, false, 0).then(function (ok) {
      state.committing = false;
      return ok;
    });
  }

  function currentUsernameGuess() {
    var d = findDialog();
    if (!d) return "";
    var inputs = d.querySelectorAll("input");
    for (var i = 0; i < inputs.length; i += 1) {
      var inp = inputs[i];
      if (inp.getAttribute("data-kb-ovpn")) continue;
      var v = (inp.value || "").trim();
      if (!v || v.length < 3) continue;
      if (state.profiles) {
        for (var j = 0; j < state.profiles.length; j += 1) {
          if ((state.profiles[j].email || "").toLowerCase() === v.toLowerCase()) return state.profiles[j].email;
        }
      }
      if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return v;
    }
    return "";
  }

  function loadProfiles(force) {
    var fresh = state.profiles && (Date.now() - state.profilesAt < 20000);
    if (fresh && !force) return Promise.resolve(state.profiles);
    return fetch(PROFILES_API + (force ? "?refresh=1" : ""), { credentials: "same-origin", headers: authHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var accs = (res && res.obj && res.obj.accounts) || [];
        state.profiles = accs; state.profilesAt = Date.now();
        return accs;
      })
      .catch(function () { return state.profiles || []; });
  }

  function dialogInputValues() {
    var d = findDialog();
    if (!d) return [];
    var out = [];
    var inputs = d.querySelectorAll("input,textarea");
    for (var i = 0; i < inputs.length; i += 1) {
      if (inputs[i].getAttribute("data-kb-ovpn")) continue;
      var v = (inputs[i].value || "").trim();
      if (v) out.push(v);
    }
    return out;
  }

  // Which account is this dialog editing? Match the dialog's own fields against
  // the OpenVPN account list (usernames are not necessarily emails).
  function resolveEmail(attempt) {
    var vals = dialogInputValues();
    return loadProfiles(!state.profiles || (attempt || 0) === 0).then(function (accs) {
      var i, j, k;
      for (i = 0; i < accs.length; i += 1) {
        var email = accs[i].email || "";
        if (!email) continue;
        for (j = 0; j < vals.length; j += 1) {
          if (vals[j].toLowerCase() === email.toLowerCase()) return email;
        }
      }
      var d = findDialog();
      var text = (d && d.textContent) || "";
      for (k = 0; k < accs.length; k += 1) {
        if (accs[k].email && text.indexOf(accs[k].email) >= 0) return accs[k].email;
      }
      if ((attempt || 0) < 2) {
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(resolveEmail((attempt || 0) + 1)); }, 700);
        });
      }
      return "";
    });
  }

  // Edit mode: show exactly what the account uses right now (fresh from server).
  function prefillLive(email) {
    if (!email) return Promise.resolve();
    state.email = email;
    return loadProfiles(false).then(function (accs) {
      var box = document.querySelector("[data-kb-ovpn-box]");
      if (!box) return;
      var hit = null;
      for (var i = 0; i < accs.length; i += 1) {
        if ((accs[i].email || "").toLowerCase() === email.toLowerCase()) { hit = accs[i]; break; }
      }
      if (!hit) return;
      // Never clobber something the admin already typed in this dialog.
      if (state.pending) return;
      if (box.__kb.username.value || box.__kb.password.value) return;
      fill(box, hit.username, hit.password);
      state.fields.username = hit.username || "";
      state.fields.password = hit.password || "";
    });
  }

  function resetDialogState(mode) {
    state.mode = mode;
    state.fields = { username: "", password: "" };
    state.pending = null;
    state.email = "";
    state.resolving = false;
    state.openAt = Date.now();
  }

  function attach() {
    var dialog = findDialog();
    if (!dialog) {
      if (state.dialogOpen) {
        state.dialogOpen = false;
        state.closedAt = Date.now();
        setTimeout(function () {
          if (!state.dialogOpen && Date.now() - state.closedAt >= 3000) {
            state.fields = { username: "", password: "" };
            state.pending = null;
            state.email = "";
            state.mode = "";
          }
        }, 4000);
      }
      return;
    }
    if (!state.dialogOpen) {
      state.dialogOpen = true;
      state.closedAt = 0;
      resetDialogState("");
    }
    var mode = dialogMode(dialog);
    if (mode && mode !== state.mode) {
      var keepFields = state.fields.username || state.fields.password;
      state.mode = mode;
      if (mode === "edit" && !keepFields) {
        state.fields = { username: "", password: "" };
        state.pending = null;
      }
    }

    var host = scrollHost(dialog);
    if (!host) return;
    var box = dialog.querySelector("[data-kb-ovpn-box]");
    if (box && box.parentElement !== host) { try { host.appendChild(box); } catch (e) {} }
    if (box && host.lastElementChild !== box && host === box.parentElement) { try { host.appendChild(box); } catch (e) {} }
    box = dialog.querySelector("[data-kb-ovpn-box]");

    if (!box) {
      box = build();
      if (host === dialog) {
        var footer = null;
        var btns = dialog.querySelectorAll("button");
        for (var i = 0; i < btns.length; i += 1) {
          var label = (btns[i].textContent || "").trim().toLowerCase();
          if (label === "cancel" || label === "create" || label === "save" || label === "update"
            || label === "لغو" || label === "ایجاد" || label === "ذخیره" || label === "ویرایش") {
            footer = btns[i].parentElement;
            break;
          }
        }
        if (footer && footer.parentElement) footer.parentElement.insertBefore(box, footer);
        else host.appendChild(box);
      } else {
        host.appendChild(box);
      }
    }

    // The box only belongs to OpenVPN members: hidden while the group is not
    // ticked, back (with the same values) as soon as it is ticked again.
    var groupOn = openVpnGroupSelected(dialog);
    state.groupOn = (groupOn === null ? true : groupOn);
    try { box.style.display = state.groupOn ? "" : "none"; } catch (e) {}
    if (!state.groupOn && state.pending) unstage(box);

    // Unknown mode (title not matched yet): decide from the presence of a user.
    if (!state.mode && Date.now() - state.openAt > 900) {
      state.mode = currentUsernameGuess() ? "edit" : "create";
    }
    if (state.mode === "edit" && !state.email && !state.resolving) {
      state.resolving = true;
      resolveEmail(0).then(function (email) {
        state.resolving = false;
        if (!email) return;
        state.email = email;
        prefillLive(email);
      });
    }
  }

  // --- hook fetch: the blue submit button is the one that applies values ------
  var origFetch = window.fetch;
  if (typeof origFetch === "function" && !window.__kbOvpnFetchHook) {
    window.__kbOvpnFetchHook = 1;
    window.fetch = function (input, init) {
      var url = "", method = "GET";
      try {
        if (typeof input === "string") url = input;
        else if (input && input.url) url = input.url;
        if (init && init.method) method = init.method;
        else if (input && input.method) method = input.method;
      } catch (e) {}
      try { captureAuth(input, init); } catch (e) {}
      var promise = origFetch.apply(this, arguments);
      try {
        var path = String(url).split("?")[0];
        var verb = String(method).toUpperCase();
        var isCreate = /\/api\/user\/?$/.test(path) && verb === "POST";
        var isUpdate = /\/api\/user\/[^/]+\/?$/.test(path) && (verb === "PUT" || verb === "PATCH");
        if (isCreate) {
          promise.then(function (res) {
            try {
              if (!res || !res.ok) return;
              res.clone().json().then(function (body) {
                var created = deepUsername(body, 0) || state.email;
                if (!created) return;
                state.email = created;
                var u = state.fields.username, p = state.fields.password;
                if (u && p && state.groupOn !== false) applyCreds(created, u, p, false, 0);
              }).catch(function () {});
            } catch (e) {}
          }).catch(function () {});
        } else if (isUpdate) {
          promise.then(function (res) {
            try {
              if (!res || !res.ok) return;
              var name = "";
              try { name = decodeURIComponent(path.split("/").filter(Boolean).pop() || ""); } catch (e) {}
              // The account being edited wins; the URL is the fallback.
              var email = state.email || name;
              if (state.pending) commitPending(email);
            } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}
      return promise;
    };
  }

  // The blue button is the final confirmation: its click commits the staged pair.
  try {
    document.addEventListener("click", function (ev) {
      try {
        if (!state.pending) return;
        var d = findDialog();
        if (!d) return;
        var btn = primarySubmit(d);
        if (!btn) return;
        var t = ev.target;
        if (!(t === btn || btn.contains(t))) return;
        scheduleCommit(1200);
      } catch (e) {}
      setTimeout(function () { try { attach(); } catch (e) {} }, 180);
    }, true);
  } catch (e) {}

  function tick() {
    try { attach(); } catch (e) {}
    try { if (state.pending) enableSubmit(); } catch (e) {}
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick);
  else tick();
  try { new MutationObserver(function () { tick(); }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  setInterval(tick, 1200);
})();

</script>
</body>
</html>
