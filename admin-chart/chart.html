<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07130d">
<title>پنل پاسارگارد | اطلاعات پنل شما</title>
<link rel="icon" href="/TeamGuccI/pasarguard/statics/favicon/android-chrome-192x192.png">
<link href="/TeamGuccI/pasarguard/statics/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg:#07130d; --card:rgba(14,26,20,.72); --card-border:rgba(52,211,153,.18);
    --text:#e8f5ee; --muted:#93b3a3; --green:#22c55e; --green2:#34d399; --mint:#6ee7b7;
    --red:#ef4444; --red2:#f87171; --amber:#f59e0b; --pill:rgba(34,197,94,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:Vazirmatn,IRANSansX,Tahoma,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100dvh; overflow-x:hidden;
    padding:18px 14px 30px; position:relative;
  }
  /* PasarGuard-style dark green living background */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
    radial-gradient(1100px 600px at 85% -10%,rgba(34,197,94,.22),transparent 60%),
    radial-gradient(900px 700px at -10% 110%,rgba(16,185,129,.16),transparent 55%),
    linear-gradient(160deg,#04120b 0%,#07130d 45%,#030905 100%)}
  .bg::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(110,231,183,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.045) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 30%,transparent 75%);
            mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 30%,transparent 75%)}
  .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;will-change:transform}
  .orb.a{width:320px;height:320px;background:#16a34a;top:-110px;right:-70px;animation:drift 16s ease-in-out infinite alternate}
  .orb.b{width:240px;height:240px;background:#059669;bottom:-90px;left:-60px;animation:drift 20s ease-in-out infinite alternate-reverse}
  .orb.c{width:150px;height:150px;background:#34d399;top:44%;left:62%;opacity:.28;animation:drift 13s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-34px,30px) scale(1.14)}}

  .wrap{max-width:540px;margin:0 auto;position:relative}
  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:22px;
    padding:20px 18px; margin-bottom:14px; backdrop-filter:blur(14px);
    box-shadow:0 18px 42px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05);
  }
  /* ---- header: logo / title / logo (as sketched) ---- */
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}
  .head img{width:56px;height:56px;border-radius:15px;box-shadow:0 0 0 1px rgba(110,231,183,.25),0 8px 22px rgba(0,0,0,.5)}
  .head h1{font-size:24px;font-weight:900;letter-spacing:-.4px;
    background:linear-gradient(92deg,#ecfdf5 10%,var(--mint) 45%,var(--green) 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .head .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:13px}
  .chip{background:var(--pill);border:1px solid rgba(52,211,153,.25);color:#bbf7d0;
    font-size:12px;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .chip b{font-weight:800;color:#f0fdf4}
  .chip.dir{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ---- big animated status (green glowing tick / red cross) ---- */
  .status{text-align:center;padding:26px 18px 22px}
  .ringwrap{width:148px;height:148px;margin:2px auto 8px;position:relative}
  .ringwrap::before,.ringwrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(34,197,94,.5);animation:pulse 2.4s ease-out infinite}
  .ringwrap::after{animation-delay:1.2s}
  .bad .ringwrap::before,.bad .ringwrap::after{border-color:rgba(239,68,68,.5)}
  @keyframes pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .ringwrap svg{width:148px;height:148px;position:relative}
  .circ{fill:rgba(34,197,94,.07);stroke:url(#gradOk);stroke-width:3;
    stroke-dasharray:440;stroke-dashoffset:440;animation:draw 1s .1s ease forwards;
    filter:drop-shadow(0 0 14px rgba(34,197,94,.55))}
  .sign{fill:none;stroke:#4ade80;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:130;stroke-dashoffset:130;animation:draw .55s .75s ease forwards;
    filter:drop-shadow(0 0 10px rgba(74,222,128,.8))}
  .bad .circ{fill:rgba(239,68,68,.07);stroke:url(#gradBad);filter:drop-shadow(0 0 14px rgba(239,68,68,.5))}
  .bad .sign{stroke:#f87171;filter:drop-shadow(0 0 10px rgba(248,113,113,.8))}
  @keyframes draw{to{stroke-dashoffset:0}}
  .status h2{font-size:21px;font-weight:900;color:#bbf7d0;text-shadow:0 0 22px rgba(34,197,94,.45)}
  .bad h2{color:#fecaca;text-shadow:0 0 22px rgba(239,68,68,.4)}
  .status p{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.9}
  .livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-inline-start:6px;
    box-shadow:0 0 10px #4ade80;animation:blink 1.6s ease-in-out infinite;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---- info sections ---- */
  .secttl{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900;color:#d1fae5;margin-bottom:14px}
  .secttl .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(145deg,rgba(34,197,94,.28),rgba(5,150,105,.12));border:1px solid rgba(52,211,153,.3)}
  .secttl .ic svg{width:17px;height:17px;stroke:#6ee7b7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px dashed rgba(147,179,163,.14)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .row .v{font-weight:800;font-size:14.5px;text-align:left}
  .row .v small{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-top:2px}
  .bar{height:12px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin:14px 0 7px;position:relative;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  .bar>i{display:block;height:100%;width:0;border-radius:999px;position:relative;
    background:linear-gradient(90deg,#059669,#22c55e 55%,#4ade80);transition:width 1.1s cubic-bezier(.22,1,.3,1);
    box-shadow:0 0 16px rgba(34,197,94,.55)}
  .bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.35) 50%,transparent 75%);
    background-size:200% 100%;animation:shine 2.2s linear infinite}
  @keyframes shine{from{background-position:180% 0}to{background-position:-80% 0}}
  .bar.hot>i{background:linear-gradient(90deg,#b45309,#f59e0b 55%,#fbbf24);box-shadow:0 0 16px rgba(245,158,11,.5)}
  .bar.full>i{background:linear-gradient(90deg,#991b1b,#ef4444 55%,#f87171);box-shadow:0 0 16px rgba(239,68,68,.5)}
  .barmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
  .barmeta b{color:var(--mint)}

  /* ---- credential rows ---- */
  .cred{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.34);border:1px solid rgba(110,231,183,.16);
    border-radius:13px;padding:9px 10px;margin-top:8px}
  .cred .lbl{font-size:11px;color:var(--muted);min-width:86px}
  .cred code{flex:1;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    color:#ecfdf5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ibtn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(52,211,153,.3);background:rgba(34,197,94,.12);
    display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:.15s}
  .ibtn:active{transform:scale(.93)}
  .ibtn svg{width:16px;height:16px;stroke:#6ee7b7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:13px;padding:13px;border:0;cursor:pointer;
    border-radius:15px;font-family:inherit;font-size:15px;font-weight:900;color:#04160b;text-decoration:none;
    background:linear-gradient(92deg,#4ade80,#22c55e 55%,#10b981);box-shadow:0 12px 28px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.35);
    transition:.15s}
  .btn:active{transform:scale(.985)}
  .btn svg{width:18px;height:18px;stroke:#04160b;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .warn{display:flex;gap:8px;color:#fca5a5;font-size:11.5px;line-height:1.9;margin-top:12px;
    background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:9px 11px}
  .muted-note{color:var(--muted);font-size:11.5px;line-height:1.9;margin-top:10px;text-align:center}
  footer{text-align:center;color:#5f7d6d;font-size:11.5px;padding:8px 0 2px;line-height:2}
  footer b{color:#86c9a8}
  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#052e1b;color:#bbf7d0;
    border:1px solid rgba(74,222,128,.5);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 14px 34px rgba(0,0,0,.55);transition:.3s;z-index:9;opacity:0;pointer-events:none}
  .toast.on{transform:translate(-50%,0);opacity:1}
  .fadeup{animation:fadeup .6s cubic-bezier(.22,1,.3,1) both}
  .d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}
  @keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast">کپی شد ✅</div>

<script>
var DATA = __CHART_DATA_JSON__;
var LOGO = "/TeamGuccI/pasarguard/statics/favicon/android-chrome-192x192.png";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var IC = {
  db:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 9.5-9.5M17 5l3 3M14 8l2.5 2.5"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24"><path d="M9.9 4.24A9.5 9.5 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg>',
  enter:'<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>',
  users:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};

function statusArt(d){
  var ok = d.status === "active";
  var sign = ok
    ? '<path class="sign" d="M38 76 L66 102 L112 50"/>'
    : '<path class="sign" d="M52 52 L98 98 M98 52 L52 98"/>';
  return '<div class="ringwrap"><svg viewBox="0 0 150 150">'
    + '<defs><linearGradient id="gradOk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#059669"/></linearGradient>'
    + '<linearGradient id="gradBad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs>'
    + '<circle class="circ" cx="75" cy="75" r="70"/>' + sign + '</svg></div>';
}

function statusText(d){
  switch(d.status){
    case "active":   return ["پنل شما فعال است","نمایندگی شما آماده‌ی استفاده است؛ کاربر بسازید و بفروشید 🚀"];
    case "disabled": return ["پنل شما غیرفعال است","این نمایندگی در حال حاضر غیرفعال شده است. برای فعال‌سازی با مدیریت در تماس باشید."];
    case "limited":  return ["پنل شما محدود شده است","حجم تعیین‌شده‌ی پنل به پایان رسیده است. برای شارژ حجم با مدیریت در تماس باشید."];
    case "expired":  return ["پنل شما منقضی شده است","مدت زمان این نمایندگی به پایان رسیده است. برای تمدید با مدیریت در تماس باشید."];
    default:         return ["پنل یافت نشد","این نمایندگی دیگر وجود ندارد یا حذف شده است."];
  }
}

function render(d){
  DATA = d;
  var ok = d.status === "active";
  var st = statusText(d);
  var barCls = d.percent==null ? "" : (d.percent>=100 ? "full" : (d.percent>=85 ? "hot" : ""));
  var barW = d.percent==null ? 100 : d.percent;
  var pass = null;
  if (d.password) pass = String(d.password);

  var h = ''
  /* header — logo both sides, as sketched */
  + '<section class="card fadeup"><div class="head">'
  +   '<img src="'+LOGO+'" alt="PasarGuard">'
  +   '<div><h1>پنل پاسارگارد</h1><div class="sub">اطلاعات پنل شما • نمایندگی</div></div>'
  +   '<img src="'+LOGO+'" alt="PasarGuard">'
  + '</div><div class="chips">'
  +   '<span class="chip dir">👤 <b>'+esc(d.username)+'</b></span>'
  +   (d.roleName ? '<span class="chip">نقش: <b>'+esc(d.roleName)+'</b></span>' : '')
  +   (d.gone ? '' : '<span class="chip">'+IC.users+' کل کاربران: <b>'+Number(d.totalUsers||0).toLocaleString("fa-IR")+'</b></span>')
  +   '<span class="chip"><span class="livedot"></span>به‌روزرسانی: '+esc(d.updatedFa||"")+'</span>'
  + '</div></section>'

  /* status hero */
  + '<section class="card status fadeup d1'+(ok?"":" bad")+'">' + statusArt(d)
  +   '<h2>'+esc(st[0])+'</h2><p>'+esc(st[1])+'</p></section>';

  if(!d.gone){
    h += ''
    /* box 1: traffic */
    + '<section class="card fadeup d2"><div class="secttl"><span class="ic">'+IC.db+'</span>حجم پنل نمایندگی</div>'
    +   '<div class="row"><span class="k">حجم تعیین‌شده‌ی پنل</span><span class="v">'+esc(d.dataLimitText)+'</span></div>'
    +   '<div class="row"><span class="k">حجم مصرف‌شده‌ی پنل</span><span class="v">'+esc(d.usedText)+'</span></div>'
    +   '<div class="row"><span class="k">حجم باقی‌مانده‌ی پنل</span><span class="v">'+esc(d.remainingText)+'</span></div>'
    +   '<div class="bar '+barCls+'"><i id="barfill"></i></div>'
    +   '<div class="barmeta"><span>مصرف: <b>'+esc(d.usedText)+'</b></span><span>'+(d.percentText? esc(d.percentText)+" مصرف شده" : "سقف نامحدود")+'</span><span>سقف: <b>'+esc(d.dataLimitText)+'</b></span></div>'
    + '</section>'

    /* box 2: dates */
    + '<section class="card fadeup d3"><div class="secttl"><span class="ic">'+IC.cal+'</span>تاریخ‌های پنل</div>'
    +   '<div class="row"><span class="k">تاریخ تعیین‌شده‌ی پنل</span><span class="v">'+esc(d.createdFa)+'<small>تاریخ ساخت نمایندگی</small></span></div>'
    +   '<div class="row"><span class="k">مدت تعیین‌شده‌ی پنل</span><span class="v">'+esc(d.durationText)+'</span></div>'
    +   '<div class="row"><span class="k">تاریخ انقضای پنل</span><span class="v">'+esc(d.expireFa)+'<small>'+esc(d.daysLeftText)+'</small></span></div>'
    + '</section>'

    /* box 3: delivery card */
    + '<section class="card fadeup d4"><div class="secttl"><span class="ic">'+IC.key+'</span>اطلاعات ورود به پنل شما</div>'
    +   '<div class="cred"><span class="lbl">🔗 لینک پنل شما</span><code>'+esc(d.panelUrl)+'</code>'
    +     '<button class="ibtn" data-copy="'+esc(d.panelUrl)+'" title="کپی لینک پنل">'+IC.copy+'</button></div>'
    +   '<div class="cred"><span class="lbl">👤 نام کاربری</span><code>'+esc(d.username)+'</code>'
    +     '<button class="ibtn" data-copy="'+esc(d.username)+'" title="کپی نام کاربری">'+IC.copy+'</button></div>'
    +   (pass !== null
        ? '<div class="cred"><span class="lbl">🔑 رمز عبور</span><code id="pwcode">••••••••••</code>'
          + '<button class="ibtn" id="pweye" title="نمایش رمز">'+IC.eye+'</button>'
          + '<button class="ibtn" data-copy="'+esc(pass)+'" title="کپی رمز عبور">'+IC.copy+'</button></div>'
        : '<div class="cred"><span class="lbl">🔑 رمز عبور</span><code style="direction:rtl;text-align:right;font-family:inherit">رمزی که هنگام تحویل نمایندگی دریافت کردید</code></div>')
    +   '<a class="btn" href="'+esc(d.panelUrl)+'" rel="noreferrer">'+IC.enter+'ورود به پنل نمایندگی</a>'
    +   '<div class="warn">⚠️<span>این صفحه و اطلاعات داخل آن <b>محرمانه</b> است. لینک این صفحه را با هیچ‌کس به اشتراک نگذارید؛ هرکس این لینک را داشته باشد اطلاعات ورود پنل شما را می‌بیند.</span></div>'
    + '</section>';
  }

  h += '<footer>ساخته‌شده با 💚 توسط تیم <b>PasarGuard</b> — پنل نمایندگی شما همیشه اینجاست؛ این صفحه را ذخیره کنید.</footer>';
  document.getElementById("app").innerHTML = h;

  var fill = document.getElementById("barfill");
  if(fill){ requestAnimationFrame(function(){ setTimeout(function(){ fill.style.width = barW + "%"; }, 120); }); }

  var eye = document.getElementById("pweye");
  if(eye && pass !== null){
    var shown = false;
    eye.addEventListener("click", function(){
      shown = !shown;
      document.getElementById("pwcode").textContent = shown ? pass : "••••••••••";
      eye.innerHTML = shown ? IC.eyeOff : IC.eye;
    });
  }
  bindCopy();
}

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}
function copyText(txt){
  function legacy(){
    try{
      var a = document.createElement("textarea");
      a.value = txt; a.setAttribute("readonly","");
      a.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
      document.body.appendChild(a); a.focus(); a.select();
      try{ a.setSelectionRange(0, a.value.length); }catch(e){}
      var ok = document.execCommand("copy");
      setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} }, 500);
      return ok;
    }catch(e){ return false; }
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast("کپی شد ✅"); }, function(){ toast(legacy()? "کپی شد ✅" : "کپی نشد؛ دستی کپی کنید"); });
  } else {
    toast(legacy()? "کپی شد ✅" : "کپی نشد؛ دستی کپی کنید");
  }
}
function bindCopy(){
  var btns = document.querySelectorAll("[data-copy]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(){ copyText(this.getAttribute("data-copy")); });
  }
}

render(DATA);

/* live refresh: panel changes appear here without a reload */
setInterval(function(){
  if(document.hidden) return;
  fetch(location.pathname.replace(/\/?$/,"/") + "info", { headers:{ "Accept":"application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && d.username){ var kept = DATA.password; d["pass" + "word"] = kept; render(d); } })
    .catch(function(){});
}, 20000);
</script>
